name: Tests — Node 24

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: "24"
          check-latest: true
      - name: Runtime version
        run: node --version
      - name: Run tests
        run: npm test
